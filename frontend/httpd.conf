LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so

RewriteEngine On

# Canonicalize: a direct request for a .html file redirects (changes the address
# bar) to the clean, extension-less URL, so .html is never visibly reachable.
RewriteRule ^/?index\.html$ / [R=301,L]

RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
RewriteRule ^/([^.]+)\.html$ /$1 [R=301,L]

# Serve <name>.html for a clean /<name> URL, without exposing .html in the browser
# (uses DOCUMENT_ROOT+REQUEST_URI rather than REQUEST_FILENAME, since at this
# server-context rewrite phase REQUEST_FILENAME isn't yet resolved to a real path)
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.html -f
RewriteRule ^/([^.]+)$ /$1.html [L]

ProxyPass /api http://backend:8080/api
ProxyPassReverse /api http://backend:8080/api
