spring:
  application:
    name: loveloveparadise
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loveloveparadise}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:loveloveparadise-dev-secret-key-min-32-chars!!}

app:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
